name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The checks live in check.yaml so a pull request runs them too; the release waits on that one job.
  check:
    uses: ./.github/workflows/check.yaml

  # The tag follows the publish, so a version is tagged only once it has shipped.
  release:
    name: Create Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/create-release.sh

  # npm trusts this workflow through GitHub's OIDC token once the package exists, so only the first publish needs NPM_TOKEN.
  publish:
    name: Publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No registry-url here, since setup-node's token would replace the OIDC exchange npm publishes through.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/ci/publish-npm.sh
